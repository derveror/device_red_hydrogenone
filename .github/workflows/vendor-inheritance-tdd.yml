name: Vendor inheritance TDD

on:
  push:
    branches:
      - vendor-inheritance-tdd

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run vendor inheritance contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_vendor_inheritance_contract -v
