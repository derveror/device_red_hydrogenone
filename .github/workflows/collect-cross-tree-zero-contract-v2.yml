name: Verify expanded device/vendor copy ownership

on:
  push:
    branches:
      - lineage-22.2-stock118-rework
    paths:
      - .github/workflows/collect-cross-tree-zero-contract-v2.yml

permissions:
  contents: write

# Re-run after adding support for the production $(notdir $f) form.
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 0

      - name: Checkout pinned vendor tree
        uses: actions/checkout@v4
        with:
          repository: derveror/proprietary_vendor_red_hydrogenone
          ref: d30ac19025b348ca61535afaaecb23b95347b2f4
          path: vendor-tree
          fetch-depth: 1

      - name: Require zero expanded PRODUCT_COPY_FILES collisions
        shell: bash
        run: |
          set -euo pipefail
          out=device-tree/docs/stock/h1a1000-r118/cross-tree-copy-contract.json
          python3 device-tree/tools/analysis/cross_tree_contract.py \
            --device-root device-tree \
            --vendor-root vendor-tree \
            --json > "$out"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('device-tree/docs/stock/h1a1000-r118/cross-tree-copy-contract.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('schema_version') != 2:
              raise SystemExit(f"unexpected analyzer schema: {data.get('schema_version')}")
          collisions = data.get('copy_destination_collisions')
          if collisions != []:
              raise SystemExit(f'expanded cross-tree copy collisions remain: {collisions}')
          concrete_init = {
              'vendor/etc/init/hw/init.qcom.rc',
              'vendor/etc/init/hw/init.qcom.usb.rc',
              'vendor/etc/init/hw/init.target.rc',
          }
          observed = set(data.get('device_copy_destinations', {}))
          missing = sorted(concrete_init - observed)
          if missing:
              raise SystemExit(f'foreach expansion missed device init destinations: {missing}')
          if any('$(notdir' in item for item in observed):
              raise SystemExit('unexpanded $(notdir) destination remains')
          data['authority'] = {
              'stock_build': 'H1A1000.082ho.01.00.10r.118',
              'stock_archive_sha256': '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e',
              'device_branch': 'lineage-22.2-stock118-rework',
              'vendor_commit': 'd30ac19025b348ca61535afaaecb23b95347b2f4',
          }
          data['status'] = 'zero_expanded_copy_destination_collisions'
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool "$out" >/dev/null

      - name: Commit expanded zero-collision evidence
        shell: bash
        working-directory: device-tree
        run: |
          set -euo pipefail
          rm .github/workflows/collect-cross-tree-zero-contract-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stock/h1a1000-r118/cross-tree-copy-contract.json .github/workflows/collect-cross-tree-zero-contract-v2.yml
          git diff --cached --check
          git commit -m 'docs: record expanded zero copy collisions'
          git fetch origin lineage-22.2-stock118-rework
          git rebase origin/lineage-22.2-stock118-rework
          git push origin HEAD:lineage-22.2-stock118-rework
