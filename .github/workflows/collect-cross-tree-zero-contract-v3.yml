name: Strict expanded device/vendor copy audit

on:
  push:
    branches:
      - lineage-22.2-stock118-rework
    paths:
      - .github/workflows/collect-cross-tree-zero-contract-v3.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: derveror/proprietary_vendor_red_hydrogenone
          ref: d30ac19025b348ca61535afaaecb23b95347b2f4
          path: vendor-tree
          fetch-depth: 1
      - name: Require strict zero-copy collision contract
        shell: bash
        run: |
          set -euo pipefail
          out=device-tree/docs/stock/h1a1000-r118/cross-tree-copy-contract.json
          python3 device-tree/tools/analysis/cross_tree_contract.py \
            --device-root device-tree \
            --vendor-root vendor-tree \
            --json > "$out"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('device-tree/docs/stock/h1a1000-r118/cross-tree-copy-contract.json')
          data = json.loads(p.read_text())
          assert data['schema_version'] == 2, data['schema_version']
          assert data['copy_destination_collisions'] == [], data['copy_destination_collisions']
          observed = set(data['device_copy_destinations'])
          expected = {
              'vendor/etc/init/hw/init.qcom.rc',
              'vendor/etc/init/hw/init.qcom.usb.rc',
              'vendor/etc/init/hw/init.target.rc',
          }
          assert expected <= observed, sorted(expected - observed)
          assert not any('$(notdir' in item for item in observed), sorted(item for item in observed if '$(notdir' in item)
          data['authority'] = {
              'stock_build': 'H1A1000.082ho.01.00.10r.118',
              'stock_archive_sha256': '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e',
              'device_branch': 'lineage-22.2-stock118-rework',
              'vendor_commit': 'd30ac19025b348ca61535afaaecb23b95347b2f4',
          }
          data['status'] = 'zero_expanded_copy_destination_collisions'
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit evidence and remove both obsolete collectors
        shell: bash
        working-directory: device-tree
        run: |
          set -euo pipefail
          rm -f .github/workflows/collect-cross-tree-zero-contract-v2.yml
          rm .github/workflows/collect-cross-tree-zero-contract-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stock/h1a1000-r118/cross-tree-copy-contract.json .github/workflows/collect-cross-tree-zero-contract-v2.yml .github/workflows/collect-cross-tree-zero-contract-v3.yml
          git diff --cached --check
          git commit -m 'docs: record strict expanded zero copy collisions'
          git fetch origin lineage-22.2-stock118-rework
          git rebase origin/lineage-22.2-stock118-rework
          git push origin HEAD:lineage-22.2-stock118-rework
