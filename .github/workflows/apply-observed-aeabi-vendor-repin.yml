name: Apply observed AEABI vendor repin

on:
  push:
    branches:
      - codex/observed-aeabi-pair-repin-staging

permissions:
  contents: write

jobs:
  repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/observed-aeabi-pair-repin-staging
          path: device-tree
          fetch-depth: 0

      - name: Checkout new vendor commit
        uses: actions/checkout@v4
        with:
          repository: derveror/proprietary_vendor_red_hydrogenone
          ref: 678a2c6dbbc82f1a07fb4b70bdfbdf7bdea4e8e9
          path: vendor-tree

      - name: Repin and verify paired trees
        shell: bash
        run: |
          set -euo pipefail
          cd device-tree

          python3 - <<'PY'
          from pathlib import Path

          old_full = '45cfe573941f699283e143aa5d7ba294faa5cbee'
          new_full = '678a2c6dbbc82f1a07fb4b70bdfbdf7bdea4e8e9'
          old_short = '45cfe57...'
          new_short = '678a2c6...'

          project = Path('PROJECT_STATE.md')
          text = project.read_text()
          if old_short not in text:
              raise SystemExit('old short vendor pin missing in PROJECT_STATE.md')
          project.write_text(text.replace(old_short, new_short))

          for rel in (
              'docs/manifests/hydrogenone-lineage-22.2.xml',
              'docs/reference/cross-tree-lock.json',
              'docs/stock/h1a1000-r118/cross-tree-copy-contract.json',
              '.github/workflows/verify-analysis.yml',
          ):
              path = Path(rel)
              text = path.read_text()
              if old_full not in text:
                  raise SystemExit(f'old full vendor pin missing in {rel}')
              path.write_text(text.replace(old_full, new_full))
          PY

          PYTHONPATH="$PWD/tests:$PWD" python3 - <<'PY'
          import pathlib, unittest
          loader = unittest.defaultTestLoader
          suite = unittest.TestSuite()
          for path in sorted(pathlib.Path('tests').glob('test_*.py')):
              if path.name == 'test_full_tree.py':
                  continue
              suite.addTests(loader.loadTestsFromName(f'tests.{path.stem}'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

          python3 tests/test_full_tree.py

          cd ..
          python3 device-tree/tools/analysis/cross_tree_contract.py \
            --device-root device-tree \
            --vendor-root vendor-tree \
            --json > "$RUNNER_TEMP/cross-tree-live.json"

          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path('device-tree')
          lock = json.loads((root / 'docs/reference/cross-tree-lock.json').read_text())
          evidence = json.loads((root / 'docs/stock/h1a1000-r118/cross-tree-copy-contract.json').read_text())
          live = json.loads(Path(os.environ['RUNNER_TEMP'], 'cross-tree-live.json').read_text())
          expected = '678a2c6dbbc82f1a07fb4b70bdfbdf7bdea4e8e9'
          vendor_head = subprocess.check_output(['git', '-C', 'vendor-tree', 'rev-parse', 'HEAD'], text=True).strip()
          assert vendor_head == expected
          assert lock['vendor_commit'] == expected
          assert evidence['authority']['vendor_commit'] == expected
          assert live['schema_version'] == 2
          assert live['copy_destination_collisions'] == []
          for key in ('device_copy_destinations', 'vendor_copy_destinations', 'copy_destination_collisions'):
              assert live[key] == evidence[key], f'stale evidence: {key}'
          PY

      - name: Commit verified repin only
        shell: bash
        run: |
          set -euo pipefail
          cd device-tree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/verify-analysis.yml \
            PROJECT_STATE.md \
            docs/manifests/hydrogenone-lineage-22.2.xml \
            docs/reference/cross-tree-lock.json \
            docs/stock/h1a1000-r118/cross-tree-copy-contract.json
          git diff --cached --quiet && { echo "Expected repin changes but found none"; exit 1; }
          git commit -m "device: repin vendor after observed ARM AEABI pair"
          git push origin HEAD:codex/observed-aeabi-pair-repin-staging
