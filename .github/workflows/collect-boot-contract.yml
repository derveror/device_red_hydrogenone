name: Collect canonical RED .118 boot contract

on:
  push:
    branches:
      - lineage-22.2-stock118-rework
    paths:
      - .github/workflows/collect-boot-contract.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical RED .118 stock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r118/parts" "$RUNNER_TEMP/r118/archive" "$RUNNER_TEMP/7zip"
          ids=(
            1_B7suPmaiZsibKtmSg_IfIcgGaPz4nvt
            1AV1tt-lmg5z0MMn7aNKArS7bFfK8VHCp
            1wxs2du2Ml_--JrOwGlyDb49QMlrPxVMB
            1OMvS4diiiOCiX-yCKHH7HZKv77QaUCFn
            18czKWOxP9Xiw5g6ljCHI1Gt68Ynzxfi4
            19bMHqds6-PsYPtrs18okJ8XgdF85Z84L
            1xKaDVx16zH11ozeSeOjSlldi1-xrHcuj
            1XF4fPiTXBzVsVQU5I3VZGxw4Xm_T_DUe
          )
          sizes=(251658240 251658240 251658240 251658240 251658240 251658240 251658240 89063443)
          for i in "${!ids[@]}"; do
            out="$RUNNER_TEMP/r118/parts/part.$i"
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=${ids[$i]}&export=download&confirm=t" \
              --output "$out"
            test "$(stat -c %s "$out")" = "${sizes[$i]}"
          done
          cat "$RUNNER_TEMP"/r118/parts/part.* > "$RUNNER_TEMP/r118/stock.rar"
          rm -rf "$RUNNER_TEMP/r118/parts"
          echo '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e  '"$RUNNER_TEMP/r118/stock.rar" | sha256sum -c -

          curl --fail --location --retry 5 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/7zip.tar.xz"
          tar -xJf "$RUNNER_TEMP/7zip.tar.xz" -C "$RUNNER_TEMP/7zip"
          chmod +x "$RUNNER_TEMP/7zip/7zz"
          seven="$RUNNER_TEMP/7zip/7zz"
          base='H1A1000.082ho.01.00.10r.118_userdebug_fastboot/fastboot'
          "$seven" e -y -o"$RUNNER_TEMP/r118/archive" "$RUNNER_TEMP/r118/stock.rar" \
            "$base/boot.img" "$base/partition.xml" "$base/build.prop"
          test "$(stat -c %s "$RUNNER_TEMP/r118/archive/boot.img")" = 46495016
          test "$(stat -c %s "$RUNNER_TEMP/r118/archive/partition.xml")" = 14104
          rm -f "$RUNNER_TEMP/r118/stock.rar"

      - name: Parse boot header v1 and partition records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path

          STOCK_SHA = '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e'
          base = Path(os.environ['RUNNER_TEMP']) / 'r118' / 'archive'
          boot_path = base / 'boot.img'
          part_path = base / 'partition.xml'
          build_prop = base / 'build.prop'
          boot = boot_path.read_bytes()

          v0_fmt = '<8s10I16s512s32s1024s'
          v0_size = struct.calcsize(v0_fmt)
          values = struct.unpack_from(v0_fmt, boot, 0)
          magic = values[0]
          if magic != b'ANDROID!':
              raise SystemExit(f'bad boot magic: {magic!r}')
          (kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size,
           second_addr, tags_addr, page_size, header_version, os_version) = values[1:11]
          name = values[11].split(b'\0', 1)[0].decode('ascii', 'replace')
          cmdline = values[12].split(b'\0', 1)[0] + values[14].split(b'\0', 1)[0]
          cmdline_text = cmdline.decode('ascii', 'replace').strip()

          if header_version != 1:
              raise SystemExit(f'expected RED .118 boot header v1, got {header_version}')
          recovery_dtbo_size, recovery_dtbo_offset, header_size = struct.unpack_from('<IQI', boot, v0_size)

          def align(value: int, alignment: int) -> int:
              return ((value + alignment - 1) // alignment) * alignment

          kernel_offset = page_size
          ramdisk_offset = kernel_offset + align(kernel_size, page_size)
          second_offset = ramdisk_offset + align(ramdisk_size, page_size)
          kernel = boot[kernel_offset:kernel_offset + kernel_size]
          ramdisk = boot[ramdisk_offset:ramdisk_offset + ramdisk_size]
          if len(kernel) != kernel_size or len(ramdisk) != ramdisk_size:
              raise SystemExit('truncated boot image payload')

          major = (os_version >> 25) & 0x7f
          minor = (os_version >> 18) & 0x7f
          patch = (os_version >> 11) & 0x7f
          year = 2000 + ((os_version >> 4) & 0x7f)
          month = os_version & 0xf

          linux_versions = sorted({m.decode('ascii', 'replace') for m in re.findall(rb'Linux version [^\x00\n]{1,160}', kernel)})

          # partition.xml differs between Qualcomm releases, so preserve exact matching records
          # instead of assuming one attribute schema.
          root = ET.parse(part_path).getroot()
          wanted = {'boot', 'system', 'vendor', 'userdata', 'recovery'}
          partition_records = []
          for elem in root.iter():
              attrs = {str(k): str(v) for k, v in elem.attrib.items()}
              text = (elem.text or '').strip()
              haystack = ' '.join([elem.tag, text, *attrs.keys(), *attrs.values()]).lower()
              if any(re.search(rf'(^|[^a-z0-9_]){re.escape(name)}([^a-z0-9_]|$)', haystack) for name in wanted):
                  partition_records.append({'tag': elem.tag, 'attributes': attrs, 'text': text})

          props = {}
          for raw in build_prop.read_text(encoding='utf-8', errors='replace').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  k, v = raw.split('=', 1)
                  if k in {'ro.build.fingerprint', 'ro.build.version.security_patch', 'ro.vendor.build.security_patch', 'ro.build.version.release', 'ro.build.version.sdk'}:
                      props[k] = v

          evidence = {
              'schema_version': 1,
              'authority': {
                  'stock_build': 'H1A1000.082ho.01.00.10r.118',
                  'stock_archive_sha256': STOCK_SHA,
                  'boot_image_size': len(boot),
                  'boot_image_sha256': hashlib.sha256(boot).hexdigest(),
              },
              'header': {
                  'header_version': header_version,
                  'header_size': header_size,
                  'page_size': page_size,
                  'kernel_size': kernel_size,
                  'kernel_addr': f'0x{kernel_addr:08x}',
                  'ramdisk_size': ramdisk_size,
                  'ramdisk_addr': f'0x{ramdisk_addr:08x}',
                  'second_size': second_size,
                  'second_addr': f'0x{second_addr:08x}',
                  'tags_addr': f'0x{tags_addr:08x}',
                  'recovery_dtbo_size': recovery_dtbo_size,
                  'recovery_dtbo_offset': recovery_dtbo_offset,
                  'name': name,
                  'cmdline': cmdline_text,
                  'os_version': f'{major}.{minor}.{patch}',
                  'os_patch_level': f'{year:04d}-{month:02d}',
              },
              'layout': {
                  'kernel_offset': kernel_offset,
                  'ramdisk_offset': ramdisk_offset,
                  'second_offset': second_offset,
              },
              'kernel': {
                  'size': len(kernel),
                  'sha256': hashlib.sha256(kernel).hexdigest(),
                  'linux_version_strings': linux_versions,
              },
              'ramdisk': {
                  'size': len(ramdisk),
                  'sha256': hashlib.sha256(ramdisk).hexdigest(),
              },
              'build_properties': props,
              'partition_xml_records': partition_records,
          }

          out = Path('docs/stock/h1a1000-r118/boot-image-contract.json')
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          md = [
              '# RED Hydrogen One .118 boot image contract', '',
              f"Canonical stock SHA-256: `{STOCK_SHA}`", '',
              f"Boot image SHA-256: `{evidence['authority']['boot_image_sha256']}`", 
              f"Header version: `{header_version}`; header size: `{header_size}`; page size: `{page_size}`.",
              f"Kernel: `{kernel_size}` bytes, SHA-256 `{evidence['kernel']['sha256']}`.",
              f"Ramdisk: `{ramdisk_size}` bytes, SHA-256 `{evidence['ramdisk']['sha256']}`.",
              f"Kernel addr: `{evidence['header']['kernel_addr']}`; ramdisk addr: `{evidence['header']['ramdisk_addr']}`; tags addr: `{evidence['header']['tags_addr']}`.",
              f"OS: `{evidence['header']['os_version']}`; patch: `{evidence['header']['os_patch_level']}`.",
              '', '## Kernel command line', '', f"`{cmdline_text}`", '',
              '## Linux version strings', '',
          ]
          md.extend([f'- `{s}`' for s in linux_versions] or ['- None found.'])
          md.extend(['', '## Matching partition.xml records', ''])
          md.extend([f"- `{row}`" for row in partition_records] or ['- None found.'])
          md.append('')
          Path('docs/stock/h1a1000-r118/BOOT_IMAGE_CONTRACT.md').write_text('\n'.join(md), encoding='utf-8')
          PY
          python3 -m json.tool docs/stock/h1a1000-r118/boot-image-contract.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/stock/h1a1000-r118/boot-image-contract.json').read_text())
          assert d['header']['header_version'] == 1
          assert d['header']['page_size'] == 4096
          assert d['kernel']['size'] == 37015950
          assert d['ramdisk']['size'] == 9466573
          assert d['header']['os_version'] == '9.0.0'
          assert d['header']['os_patch_level'] == '2019-04'
          PY
          git diff --check

      - name: Commit evidence and remove one-shot collector
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/collect-boot-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stock/h1a1000-r118/boot-image-contract.json \
            docs/stock/h1a1000-r118/BOOT_IMAGE_CONTRACT.md \
            .github/workflows/collect-boot-contract.yml
          git diff --cached --check
          git commit -m 'docs: record canonical RED .118 boot image contract'
          git fetch origin lineage-22.2-stock118-rework
          git rebase origin/lineage-22.2-stock118-rework
          git push origin HEAD:lineage-22.2-stock118-rework
