name: Restore audit-pinned RED .118 media profiles

on:
  push:
    branches: [media-profiles-stock118-tdd]
    paths: [.github/workflows/apply-media-profiles-stock118.yml]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove media profile contract is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_media_profiles_stock118_contract -v >"$RUNNER_TEMP/media-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/media-red.log"
          test "$rc" -ne 0
          grep -Eq 'FAIL|AssertionError' "$RUNNER_TEMP/media-red.log"

      - name: Reconstruct canonical RED .118 vendor image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r118/parts" "$RUNNER_TEMP/r118/archive" "$RUNNER_TEMP/r118/vendor-root" "$RUNNER_TEMP/7zip"
          ids=(1_B7suPmaiZsibKtmSg_IfIcgGaPz4nvt 1AV1tt-lmg5z0MMn7aNKArS7bFfK8VHCp 1wxs2du2Ml_--JrOwGlyDb49QMlrPxVMB 1OMvS4diiiOCiX-yCKHH7HZKv77QaUCFn 18czKWOxP9Xiw5g6ljCHI1Gt68Ynzxfi4 19bMHqds6-PsYPtrs18okJ8XgdF85Z84L 1xKaDVx16zH11ozeSeOjSlldi1-xrHcuj 1XF4fPiTXBzVsVQU5I3VZGxw4Xm_T_DUe)
          sizes=(251658240 251658240 251658240 251658240 251658240 251658240 251658240 89063443)
          for i in "${!ids[@]}"; do
            out="$RUNNER_TEMP/r118/parts/part.$i"
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "https://drive.usercontent.google.com/download?id=${ids[$i]}&export=download&confirm=t" --output "$out"
            test "$(stat -c %s "$out")" = "${sizes[$i]}"
          done
          cat "$RUNNER_TEMP"/r118/parts/part.* > "$RUNNER_TEMP/r118/stock.rar"
          rm -rf "$RUNNER_TEMP/r118/parts"
          echo '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e  '"$RUNNER_TEMP/r118/stock.rar" | sha256sum -c -
          curl --fail --location --retry 5 https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz --output "$RUNNER_TEMP/7zip.tar.xz"
          tar -xJf "$RUNNER_TEMP/7zip.tar.xz" -C "$RUNNER_TEMP/7zip"
          chmod +x "$RUNNER_TEMP/7zip/7zz"
          seven="$RUNNER_TEMP/7zip/7zz"
          base='H1A1000.082ho.01.00.10r.118_userdebug_fastboot/fastboot'
          "$seven" e -y -o"$RUNNER_TEMP/r118/archive" "$RUNNER_TEMP/r118/stock.rar" "$base/vendor.img"
          test "$(stat -c %s "$RUNNER_TEMP/r118/archive/vendor.img")" = 593264872
          rm -f "$RUNNER_TEMP/r118/stock.rar"
          "$seven" x -y -o"$RUNNER_TEMP/r118/vendor-root" "$RUNNER_TEMP/r118/archive/vendor.img" 'etc/media_profiles_V1_0.xml'
          test -f "$RUNNER_TEMP/r118/vendor-root/etc/media_profiles_V1_0.xml"

      - name: Verify audit identity and install exact stock file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          audit=json.loads(Path('docs/stock/h1a1000-r118/device-vs-stock-config-audit.json').read_text())
          assert audit['authority']['stock_archive_sha256']=='7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e'
          row=next(r for r in audit['rows'] if r['source']=='media/media_profiles_V1_0.xml')
          src=Path(os.environ['RUNNER_TEMP'])/'r118'/'vendor-root'/row['stock_relative_path']
          data=src.read_bytes()
          assert len(data)==row['stock_size'], (len(data),row['stock_size'])
          assert hashlib.sha256(data).hexdigest()==row['stock_sha256']
          shutil.copyfile(src,Path('media/media_profiles_V1_0.xml'))
          PY

      - name: Verify GREEN and complete tree
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_media_profiles_stock118_contract -v
          PYTHONPATH="$PWD/tests:$PWD" python3 - <<'PY'
          import pathlib, unittest
          loader=unittest.defaultTestLoader; suite=unittest.TestSuite()
          for p in sorted(pathlib.Path('tests').glob('test_*.py')):
              if p.name != 'test_full_tree.py': suite.addTests(loader.loadTestsFromName(f'tests.{p.stem}'))
          r=unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if r.wasSuccessful() else 1)
          PY
          python3 tests/test_full_tree.py
          git diff --check

      - name: Commit verified media profiles and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-media-profiles-stock118.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_media_profiles_stock118_contract.py media/media_profiles_V1_0.xml .github/workflows/apply-media-profiles-stock118.yml
          git diff --cached --check
          git commit -m 'media: restore canonical RED .118 camera profiles'
          git fetch origin media-profiles-stock118-tdd
          git rebase origin/media-profiles-stock118-tdd
          git push origin HEAD:media-profiles-stock118-tdd
