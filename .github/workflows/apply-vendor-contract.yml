name: Apply verified vendor-contract patch series

on:
  push:
    branches:
      - tmp-apply-vendor-contract-20260902
    paths:
      - .github/workflows/apply-vendor-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout protected target branch
        uses: actions/checkout@v4
        with:
          ref: lineage-22.2-stock118-rework
          fetch-depth: 0
          persist-credentials: true

      - name: Locate patch series in the shared Google Drive folder
        id: drive
        shell: bash
        env:
          DRIVE_FOLDER_ID: 1pii_SjQSbqV7PT9F-LVAs-5B7pMnm4kl
          PATCH_ARCHIVE: hydrogenone-device-patch-series-2026-09-02.tar.gz
          PATCH_CHECKSUM: hydrogenone-device-patch-series-2026-09-02.tar.gz.sha256
        run: |
          set -euo pipefail
          python3 - <<'PY' > drive-files.env
          import html
          import re
          import os
          import urllib.request
          from html.parser import HTMLParser

          folder = os.environ['DRIVE_FOLDER_ID']
          wanted = {os.environ['PATCH_ARCHIVE'], os.environ['PATCH_CHECKSUM']}
          url = f'https://drive.google.com/embeddedfolderview?id={folder}#list'
          request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          page = urllib.request.urlopen(request, timeout=60).read().decode('utf-8', 'replace')

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.href = None
                  self.text = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.href = dict(attrs).get('href')
                      self.text = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.href is not None:
                      self.links.append((self.href, ''.join(self.text).strip()))
                      self.href = None
                      self.text = []

          parser = LinkParser()
          parser.feed(page)
          found = {}
          for href, title in parser.links:
              title = html.unescape(title)
              match = re.search(r'/file/d/([A-Za-z0-9_-]+)', href or '')
              if match and title in wanted:
                  found[title] = match.group(1)

          # Fallback for Drive page variants that render file records in script data.
          for name in wanted - found.keys():
              for occurrence in re.finditer(re.escape(name), page):
                  window = page[max(0, occurrence.start() - 1600):occurrence.end() + 400]
                  ids = re.findall(r'/file/d/([A-Za-z0-9_-]+)', window)
                  if ids:
                      found[name] = ids[-1]
                      break

          missing = sorted(wanted - found.keys())
          if missing:
              raise SystemExit('missing public Drive files: ' + ', '.join(missing))
          print(f"PATCH_ARCHIVE_ID={found[os.environ['PATCH_ARCHIVE']]}")
          print(f"PATCH_CHECKSUM_ID={found[os.environ['PATCH_CHECKSUM']]}")
          PY
          cat drive-files.env >> "$GITHUB_ENV"

      - name: Download and verify patch transport
        shell: bash
        env:
          PATCH_ARCHIVE: hydrogenone-device-patch-series-2026-09-02.tar.gz
          PATCH_CHECKSUM: hydrogenone-device-patch-series-2026-09-02.tar.gz.sha256
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=${PATCH_ARCHIVE_ID}" --output "$PATCH_ARCHIVE"
          gdown "https://drive.google.com/uc?id=${PATCH_CHECKSUM_ID}" --output "$PATCH_CHECKSUM"
          sha256sum -c "$PATCH_CHECKSUM"
          mkdir patch-input
          tar -C patch-input -xzf "$PATCH_ARCHIVE"
          cd patch-input/hydrogenone-device-patch-series
          sha256sum -c PATCHES.sha256
          python3 -m json.tool MANIFEST.json >/dev/null

      - name: Apply the complete linear commit series
        shell: bash
        run: |
          set -euo pipefail
          expected_base=dbe3617bb0d0ab2f2a827c268751f5c135f3ee84
          test "$(git rev-parse HEAD)" = "$expected_base"
          git config user.name derveror
          git config user.email 58082462+derveror@users.noreply.github.com
          git am --committer-date-is-author-date patch-input/hydrogenone-device-patch-series/patches/*.patch
          test ! -e device/red/msm8998-common
          test ! -e vendor/red/msm8998-common

      - name: Verify device and vendor-contract tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/reference/source-lock.json >/dev/null
          python3 -m json.tool docs/stock/h1a1000-r118/inventory-summary.json >/dev/null
          python3 tools/analysis/source_lock.py \
            --validate \
            --lock docs/reference/source-lock.json \
            --inventory docs/reference/archive-inventory.json
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/test_full_tree.py
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Push only a fast-forward update to the protected work branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:lineage-22.2-stock118-rework
