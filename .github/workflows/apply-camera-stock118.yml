name: Restore canonical RED .118 camera configs

on:
  push:
    branches:
      - camera-stock118-tdd
    paths:
      - .github/workflows/apply-camera-stock118.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove current camera tree is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_camera_stock118_contract -v >"$RUNNER_TEMP/camera-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/camera-red.log"
          test "$rc" -ne 0
          grep -Fq 'camera stock identity mismatch' "$RUNNER_TEMP/camera-red.log"

      - name: Reconstruct canonical RED .118 vendor image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r118/parts" "$RUNNER_TEMP/r118/archive" "$RUNNER_TEMP/r118/camera" "$RUNNER_TEMP/7zip"
          ids=(
            1_B7suPmaiZsibKtmSg_IfIcgGaPz4nvt
            1AV1tt-lmg5z0MMn7aNKArS7bFfK8VHCp
            1wxs2du2Ml_--JrOwGlyDb49QMlrPxVMB
            1OMvS4diiiOCiX-yCKHH7HZKv77QaUCFn
            18czKWOxP9Xiw5g6ljCHI1Gt68Ynzxfi4
            19bMHqds6-PsYPtrs18okJ8XgdF85Z84L
            1xKaDVx16zH11ozeSeOjSlldi1-xrHcuj
            1XF4fPiTXBzVsVQU5I3VZGxw4Xm_T_DUe
          )
          sizes=(251658240 251658240 251658240 251658240 251658240 251658240 251658240 89063443)
          for i in "${!ids[@]}"; do
            out="$RUNNER_TEMP/r118/parts/part.$i"
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=${ids[$i]}&export=download&confirm=t" \
              --output "$out"
            test "$(stat -c %s "$out")" = "${sizes[$i]}"
          done
          cat "$RUNNER_TEMP"/r118/parts/part.* > "$RUNNER_TEMP/r118/stock.rar"
          rm -rf "$RUNNER_TEMP/r118/parts"
          echo '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e  '"$RUNNER_TEMP/r118/stock.rar" | sha256sum -c -

          curl --fail --location --retry 5 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/7zip.tar.xz"
          tar -xJf "$RUNNER_TEMP/7zip.tar.xz" -C "$RUNNER_TEMP/7zip"
          chmod +x "$RUNNER_TEMP/7zip/7zz"
          seven="$RUNNER_TEMP/7zip/7zz"
          base='H1A1000.082ho.01.00.10r.118_userdebug_fastboot/fastboot'
          "$seven" e -y -o"$RUNNER_TEMP/r118/archive" "$RUNNER_TEMP/r118/stock.rar" "$base/vendor.img"
          test "$(stat -c %s "$RUNNER_TEMP/r118/archive/vendor.img")" = 593264872
          rm -f "$RUNNER_TEMP/r118/stock.rar"

      - name: Extract and install exact RED .118 camera files
        shell: bash
        run: |
          set -euo pipefail
          seven="$RUNNER_TEMP/7zip/7zz"
          image="$RUNNER_TEMP/r118/archive/vendor.img"
          for name in camera_config.xml imx268_main_chromatix.xml imx268_sub_chromatix.xml imx380_main_chromatix.xml imx380_sub_chromatix.xml; do
            "$seven" e -y -o"$RUNNER_TEMP/r118/camera" "$image" "etc/camera/$name"
          done
          cd "$RUNNER_TEMP/r118/camera"
          test "$(stat -c %s camera_config.xml)" = 5903
          echo '436c8d655df7bde99889a10e2fdd6a7a1c9c540829b5428c55de61bdb6d9e5ef  camera_config.xml' | sha256sum -c -
          test "$(stat -c %s imx268_main_chromatix.xml)" = 11295
          echo '70726f6300db246e16316dac0d8fc0ae46851543df0aa6c9ee9d54367d9abcd2  imx268_main_chromatix.xml' | sha256sum -c -
          test "$(stat -c %s imx268_sub_chromatix.xml)" = 11271
          echo '436887e6d26c83d7be69dc10403edee5e56c416566e563eef962521f3dd3fa84  imx268_sub_chromatix.xml' | sha256sum -c -
          test "$(stat -c %s imx380_main_chromatix.xml)" = 14923
          echo 'e6d7d669c9771161f9337eb8d47a40ba720b093712cc0f75f809462ddb6431df  imx380_main_chromatix.xml' | sha256sum -c -
          test "$(stat -c %s imx380_sub_chromatix.xml)" = 16489
          echo '9cb4ed48cca0bb97314872779686150728a4129efe0ac07af2c9c33d944649fd  imx380_sub_chromatix.xml' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          install -m 0644 "$RUNNER_TEMP/r118/camera/camera_config.xml" configs/camera/camera_config.xml
          install -m 0644 "$RUNNER_TEMP/r118/camera/imx268_main_chromatix.xml" configs/camera/imx268_main_chromatix.xml
          install -m 0644 "$RUNNER_TEMP/r118/camera/imx268_sub_chromatix.xml" configs/camera/imx268_sub_chromatix.xml
          install -m 0644 "$RUNNER_TEMP/r118/camera/imx380_main_chromatix.xml" configs/camera/imx380_main_chromatix.xml
          install -m 0644 "$RUNNER_TEMP/r118/camera/imx380_sub_chromatix.xml" configs/camera/imx380_sub_chromatix.xml

      - name: Verify camera GREEN and full current tree
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_camera_stock118_contract -v
          PYTHONPATH="$PWD/tests:$PWD" python3 - <<'PY'
          import pathlib, unittest
          loader=unittest.defaultTestLoader
          suite=unittest.TestSuite()
          for path in sorted(pathlib.Path('tests').glob('test_*.py')):
              if path.name == 'test_full_tree.py':
                  continue
              suite.addTests(loader.loadTestsFromName(f'tests.{path.stem}'))
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          python3 tests/test_full_tree.py
          git diff --check

      - name: Commit verified camera contract and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-camera-stock118.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_camera_stock118_contract.py configs/camera/camera_config.xml \
            configs/camera/imx268_main_chromatix.xml configs/camera/imx268_sub_chromatix.xml \
            configs/camera/imx380_main_chromatix.xml configs/camera/imx380_sub_chromatix.xml \
            .github/workflows/apply-camera-stock118.yml
          git diff --cached --check
          git commit -m 'camera: restore canonical RED .118 topology and tuning'
          git fetch origin camera-stock118-tdd
          git rebase origin/camera-stock118-tdd
          git push origin HEAD:camera-stock118-tdd
