name: Repin verified cross-tree contract

on:
  push:
    branches:
      - codex/lineage-22.2-bringup-audit

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 0

      - name: Checkout verified vendor tree
        uses: actions/checkout@v4
        with:
          repository: derveror/proprietary_vendor_red_hydrogenone
          ref: 105aae6fda2361defd0ab16fcd558fc08673e9dc
          path: vendor-tree
          fetch-depth: 1

      - name: Regenerate verified zero-collision evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 device-tree/tools/analysis/cross_tree_contract.py \
            --device-root device-tree \
            --vendor-root vendor-tree \
            --json > "$RUNNER_TEMP/cross-tree-live.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          vendor_commit = "105aae6fda2361defd0ab16fcd558fc08673e9dc"
          device_branch = "codex/lineage-22.2-bringup-audit"
          stock_build = "H1A1000.082ho.01.00.10r.118"
          stock_sha = "7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e"
          root = Path('device-tree')

          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cross-tree-live.json').read_text())
          assert report['schema_version'] == 2
          assert report['copy_destination_collisions'] == [], report['copy_destination_collisions']
          print('CROSS_TREE_COLLISION_COUNT=0')
          report['device_root'] = '.'
          report['vendor_root'] = 'vendor/red/hydrogenone'
          report['authority'] = {
              'device_branch': device_branch,
              'stock_archive_sha256': stock_sha,
              'stock_build': stock_build,
              'vendor_commit': vendor_commit,
          }
          report['status'] = 'zero_expanded_copy_destination_collisions'
          (root / 'docs/stock/h1a1000-r118/cross-tree-copy-contract.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )

          lock = {
              'schema_version': 1,
              'device_branch': device_branch,
              'vendor_repository': 'derveror/proprietary_vendor_red_hydrogenone',
              'vendor_commit': vendor_commit,
              'stock_build': stock_build,
              'stock_archive_sha256': stock_sha,
          }
          (root / 'docs/reference/cross-tree-lock.json').write_text(
              json.dumps(lock, indent=2) + '\n'
          )

          written = json.loads((root / 'docs/stock/h1a1000-r118/cross-tree-copy-contract.json').read_text())
          written_lock = json.loads((root / 'docs/reference/cross-tree-lock.json').read_text())
          assert written['copy_destination_collisions'] == []
          assert written['authority']['vendor_commit'] == written_lock['vendor_commit']
          assert written['authority']['device_branch'] == written_lock['device_branch']
          PY

          cd device-tree
          git diff --check

      - name: Commit generated lock and evidence
        shell: bash
        run: |
          set -euo pipefail
          cd device-tree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/reference/cross-tree-lock.json \
            docs/stock/h1a1000-r118/cross-tree-copy-contract.json
          if git diff --cached --quiet; then
            echo "cross-tree evidence already pinned"
            exit 0
          fi
          git commit -m "device: pin verified vendor compatibility evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
