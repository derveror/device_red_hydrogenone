name: Radio property TDD

on:
  push:
    branches:
      - radio-prop-tdd

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run RED .118 radio runtime contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_radio_runtime_contract -v
