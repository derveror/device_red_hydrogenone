name: Replace canonical RED .118 prebuilt kernel

on:
  push:
    branches:
      - stock118-build-contract-tdd
    paths:
      - .github/workflows/replace-stock118-kernel.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical RED .118 stock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r118/parts"
          ids=(
            1_B7suPmaiZsibKtmSg_IfIcgGaPz4nvt
            1AV1tt-lmg5z0MMn7aNKArS7bFfK8VHCp
            1wxs2du2Ml_--JrOwGlyDb49QMlrPxVMB
            1OMvS4diiiOCiX-yCKHH7HZKv77QaUCFn
            18czKWOxP9Xiw5g6ljCHI1Gt68Ynzxfi4
            19bMHqds6-PsYPtrs18okJ8XgdF85Z84L
            1xKaDVx16zH11ozeSeOjSlldi1-xrHcuj
            1XF4fPiTXBzVsVQU5I3VZGxw4Xm_T_DUe
          )
          sizes=(251658240 251658240 251658240 251658240 251658240 251658240 251658240 89063443)
          for i in "${!ids[@]}"; do
            out="$RUNNER_TEMP/r118/parts/part.$i"
            url="https://drive.usercontent.google.com/download?id=${ids[$i]}&export=download&confirm=t"
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$url" --output "$out"
            test "$(stat -c %s "$out")" = "${sizes[$i]}"
          done
          cat "$RUNNER_TEMP"/r118/parts/part.* > "$RUNNER_TEMP/r118/stock.rar"
          echo '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e  '"$RUNNER_TEMP/r118/stock.rar" | sha256sum -c -

      - name: Extract exact kernel from canonical boot.img
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/7zip.tar.xz"
          mkdir -p "$RUNNER_TEMP/7zip" "$RUNNER_TEMP/r118/boot"
          tar -xJf "$RUNNER_TEMP/7zip.tar.xz" -C "$RUNNER_TEMP/7zip"
          chmod +x "$RUNNER_TEMP/7zip/7zz"
          seven="$RUNNER_TEMP/7zip/7zz"
          archive_path='H1A1000.082ho.01.00.10r.118_userdebug_fastboot/fastboot/boot.img'
          "$seven" e -y -o"$RUNNER_TEMP/r118/boot" "$RUNNER_TEMP/r118/stock.rar" "$archive_path"
          test "$(stat -c %s "$RUNNER_TEMP/r118/boot/boot.img")" = 46495016
          echo '8e120a2920f5d4eec65cb5929d31fe271738af85b218d5adb96035eb28806af6  '"$RUNNER_TEMP/r118/boot/boot.img" | sha256sum -c -

          dd if="$RUNNER_TEMP/r118/boot/boot.img" of="$RUNNER_TEMP/r118/kernel" bs=1 skip=4096 count=37015950 status=none
          test "$(stat -c %s "$RUNNER_TEMP/r118/kernel")" = 37015950
          echo '584ed86bab46bf57c2cd6b6b48ac4026c5d24a70d57bcdd04472d39c5591064d  '"$RUNNER_TEMP/r118/kernel" | sha256sum -c -
          install -m 0644 "$RUNNER_TEMP/r118/kernel" prebuilt/Image.gz-dtb

      - name: Verify GREEN build contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_stock118_build_contract -v
          git diff --check
          test "$(stat -c %s prebuilt/Image.gz-dtb)" = 37015950
          echo '584ed86bab46bf57c2cd6b6b48ac4026c5d24a70d57bcdd04472d39c5591064d  prebuilt/Image.gz-dtb' | sha256sum -c -

      - name: Commit verified kernel and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/replace-stock118-kernel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilt/Image.gz-dtb .github/workflows/replace-stock118-kernel.yml
          git commit -m 'device: replace prebuilt kernel with canonical RED .118 image'
          git fetch origin stock118-build-contract-tdd
          git rebase origin/stock118-build-contract-tdd
          git push origin HEAD:stock118-build-contract-tdd
