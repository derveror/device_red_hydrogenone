name: Regenerate pinned cross-tree evidence

on:
  push:
    branches:
      - lineage-22.2-stock118-rework
    paths:
      - .github/workflows/regenerate-cross-tree-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned vendor tree
        uses: actions/checkout@v4
        with:
          repository: derveror/proprietary_vendor_red_hydrogenone
          ref: 6fef3d7c6333602d7114aefa0284a03f5aadb454
          path: vendor-tree

      - name: Move vendor outside device scan root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/vendor-tree"
          mv vendor-tree "$RUNNER_TEMP/vendor-tree"
          test "$(git -C "$RUNNER_TEMP/vendor-tree" rev-parse HEAD)" = '6fef3d7c6333602d7114aefa0284a03f5aadb454'

      - name: Regenerate evidence from exact isolated trees
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analysis/cross_tree_contract.py \
            --device-root . \
            --vendor-root "$RUNNER_TEMP/vendor-tree" \
            --json > "$RUNNER_TEMP/cross-tree-live.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          lock_path = Path('docs/reference/cross-tree-lock.json')
          out_path = Path('docs/stock/h1a1000-r118/cross-tree-copy-contract.json')
          lock = json.loads(lock_path.read_text())
          live = json.loads(Path(os.environ['RUNNER_TEMP'], 'cross-tree-live.json').read_text())
          vendor_root = Path(os.environ['RUNNER_TEMP'], 'vendor-tree')
          vendor_head = subprocess.check_output(['git', '-C', str(vendor_root), 'rev-parse', 'HEAD'], text=True).strip()

          collisions = live.get('copy_destination_collisions', [])
          print('LIVE_COPY_DESTINATION_COLLISIONS=' + json.dumps(collisions, sort_keys=True))
          assert vendor_head == lock['vendor_commit'], (vendor_head, lock['vendor_commit'])
          assert live['schema_version'] == 2, live
          assert collisions == [], collisions

          live['authority'] = {
              'device_branch': lock['device_branch'],
              'stock_archive_sha256': lock['stock_archive_sha256'],
              'stock_build': lock['stock_build'],
              'vendor_commit': lock['vendor_commit'],
          }
          live['status'] = 'zero_expanded_copy_destination_collisions'
          out_path.write_text(json.dumps(live, indent=2, sort_keys=True) + '\n')
          PY

      - name: Verify regenerated lock and evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_cross_tree_lock tests.test_cross_tree_contract -v
          git diff --check

      - name: Commit regenerated evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-cross-tree-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: regenerate cross-tree evidence for verified vendor head'
          git pull --rebase origin lineage-22.2-stock118-rework
          git push origin HEAD:lineage-22.2-stock118-rework
