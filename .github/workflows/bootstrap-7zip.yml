name: Bootstrap portable 7-Zip

on:
  push:
    branches:
      - lineage-22.2-stock118-rework
    paths:
      - .github/workflows/bootstrap-7zip.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official 7-Zip Linux console build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            --output 7z2602-linux-x64.tar.xz
          mkdir unpacked artifact
          tar -xJf 7z2602-linux-x64.tar.xz -C unpacked
          install -m 0755 unpacked/7zz artifact/7zz
          artifact/7zz i > artifact/7zz-info.txt
          sha256sum 7z2602-linux-x64.tar.xz artifact/7zz > artifact/SHA256SUMS

      - name: Upload portable extractor
        uses: actions/upload-artifact@v4
        with:
          name: portable-7zip-linux-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 1
