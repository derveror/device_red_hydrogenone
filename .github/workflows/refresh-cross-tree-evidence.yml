name: Refresh collision-free cross-tree evidence

on:
  push:
    branches:
      - cross-tree-green-tdd
    paths:
      - .github/workflows/refresh-cross-tree-evidence.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned verified vendor tree
        shell: bash
        run: |
          set -euo pipefail
          vendor_commit=d30ac19025b348ca61535afaaecb23b95347b2f4
          mkdir -p "$RUNNER_TEMP/vendor"
          curl --fail --location --retry 5 \
            "https://github.com/derveror/proprietary_vendor_red_hydrogenone/archive/${vendor_commit}.tar.gz" \
            --output "$RUNNER_TEMP/vendor.tar.gz"
          tar -xzf "$RUNNER_TEMP/vendor.tar.gz" -C "$RUNNER_TEMP/vendor" --strip-components=1
          test -f "$RUNNER_TEMP/vendor/hydrogenone-vendor.mk"
          test -f "$RUNNER_TEMP/vendor/proprietary-manifest.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          vendor=Path(os.environ['RUNNER_TEMP'])/'vendor'
          m=json.loads((vendor/'proprietary-manifest.json').read_text())
          assert m['canonical_stock']['sha256'] == '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e'
          assert m['counts'] == {'P0':108,'P1':374,'P2':17,'total':499}, m['counts']
          PY

      - name: Generate current device/vendor ownership report
        shell: bash
        run: |
          set -euo pipefail
          vendor_commit=d30ac19025b348ca61535afaaecb23b95347b2f4
          raw="$RUNNER_TEMP/cross-tree.raw.json"
          python3 tools/analysis/cross_tree_contract.py \
            --device-root . \
            --vendor-root "$RUNNER_TEMP/vendor" \
            --json > "$raw"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          vendor_commit='d30ac19025b348ca61535afaaecb23b95347b2f4'
          raw=Path(os.environ['RUNNER_TEMP'])/'cross-tree.raw.json'
          report=json.loads(raw.read_text())
          assert report['copy_destination_collisions'] == [], report['copy_destination_collisions']
          report['authority']={
              'device_branch':'lineage-22.2-stock118-rework',
              'vendor_commit':vendor_commit,
              'stock_build':'H1A1000.082ho.01.00.10r.118',
              'stock_archive_sha256':'7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e',
          }
          report['device_root']='device-tree'
          report['vendor_root']='vendor-tree'
          out=Path('docs/stock/h1a1000-r118/cross-tree-copy-contract.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')

          device=report['device_copy_destinations']
          vendor=report['vendor_copy_destinations']
          lines=[
              '# RED Hydrogen One cross-tree copy ownership', '',
              f'Vendor commit: `{vendor_commit}`',
              'Stock authority: `.118` / `7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e`.', '',
              '## Result', '',
              '**0 `PRODUCT_COPY_FILES` destination collisions.**', '',
              'Ownership decisions:',
              '- `vendor/etc/libnfc-nci.conf` — vendor-owned exact RED `.118` hardware config.',
              '- `vendor/etc/thermal-engine.conf` — vendor-owned exact RED `.118` hardware config.',
              '- `vendor/etc/permissions/android.hardware.nfc.hce.xml` — source/device-owned AOSP feature declaration.',
              '- `vendor/etc/permissions/android.hardware.nfc.xml` — source/device-owned AOSP feature declaration.', '',
              f'Device copy destinations: `{len(device)}`.',
              f'Vendor copy destinations: `{len(vendor)}`.', '',
          ]
          Path('docs/stock/h1a1000-r118/CROSS_TREE_COPY_CONTRACT.md').write_text('\n'.join(lines))
          PY
          python3 -m json.tool docs/stock/h1a1000-r118/cross-tree-copy-contract.json >/dev/null
          git diff --check

      - name: Verify refreshed evidence contract GREEN
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_cross_tree_contract -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/stock/h1a1000-r118/cross-tree-copy-contract.json').read_text())
          assert c['authority']['vendor_commit'] == 'd30ac19025b348ca61535afaaecb23b95347b2f4'
          assert c['copy_destination_collisions'] == []
          PY

      - name: Commit evidence and permanent test
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cross-tree-green-tdd.yml
          rm .github/workflows/refresh-cross-tree-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_cross_tree_contract.py \
            docs/stock/h1a1000-r118/cross-tree-copy-contract.json \
            docs/stock/h1a1000-r118/CROSS_TREE_COPY_CONTRACT.md \
            .github/workflows/cross-tree-green-tdd.yml \
            .github/workflows/refresh-cross-tree-evidence.yml
          git diff --cached --check
          git commit -m 'tests: pin collision-free current cross-tree ownership'
          git fetch origin cross-tree-green-tdd
          git rebase origin/cross-tree-green-tdd
          git push origin HEAD:cross-tree-green-tdd
