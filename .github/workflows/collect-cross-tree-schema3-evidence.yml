name: Collect schema-v3 cross-tree ownership evidence

on:
  push:
    branches:
      - cross-tree-schema3-integration2
    paths:
      - .github/workflows/collect-cross-tree-schema3-evidence.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device integration tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 0

      - name: Checkout pinned vendor tree
        uses: actions/checkout@v4
        with:
          repository: derveror/proprietary_vendor_red_hydrogenone
          ref: d30ac19025b348ca61535afaaecb23b95347b2f4
          path: vendor-tree
          fetch-depth: 1

      - name: Generate strict schema-v3 report
        shell: bash
        run: |
          set -euo pipefail
          out=device-tree/docs/stock/h1a1000-r118/cross-tree-copy-contract.json
          python3 device-tree/tools/analysis/cross_tree_contract.py \
            --device-root device-tree \
            --vendor-root vendor-tree \
            --json > "$out"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('device-tree/docs/stock/h1a1000-r118/cross-tree-copy-contract.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema_version'] == 3, data['schema_version']
          zero_keys = (
              'copy_destination_collisions',
              'device_copy_vs_vendor_soong_collisions',
              'vendor_copy_vs_vendor_soong_collisions',
              'copy_vs_vendor_soong_collisions',
              'vendor_soong_output_collisions',
              'install_destination_collisions',
          )
          for key in zero_keys:
              assert data[key] == [], (key, data[key])
          assert len(data['vendor_soong_install_outputs']) == 451, len(data['vendor_soong_install_outputs'])
          observed = set(data['device_copy_destinations'])
          expected_init = {
              'vendor/etc/init/hw/init.qcom.rc',
              'vendor/etc/init/hw/init.qcom.usb.rc',
              'vendor/etc/init/hw/init.target.rc',
          }
          assert expected_init <= observed, sorted(expected_init - observed)
          assert not any('$(notdir' in item for item in observed)
          data['authority'] = {
              'stock_build': 'H1A1000.082ho.01.00.10r.118',
              'stock_archive_sha256': '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e',
              'device_branch': 'lineage-22.2-stock118-rework',
              'vendor_commit': 'd30ac19025b348ca61535afaaecb23b95347b2f4',
          }
          data['status'] = 'zero_make_and_soong_install_collisions'
          data['summary'] = {
              'vendor_soong_install_outputs': len(data['vendor_soong_install_outputs']),
              'aggregate_install_collisions': len(data['install_destination_collisions']),
          }
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool "$out" >/dev/null

      - name: Commit evidence and remove one-shot collector
        shell: bash
        working-directory: device-tree
        run: |
          set -euo pipefail
          rm .github/workflows/collect-cross-tree-schema3-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: record schema-v3 Make and Soong ownership evidence'
          git push origin HEAD:cross-tree-schema3-integration2
