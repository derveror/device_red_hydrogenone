name: Diagnose verified cross-tree contract

on:
  push:
    branches:
      - codex/lineage-22.2-bringup-audit

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Checkout verified vendor tree
        uses: actions/checkout@v4
        with:
          repository: derveror/proprietary_vendor_red_hydrogenone
          ref: 105aae6fda2361defd0ab16fcd558fc08673e9dc
          path: vendor-tree
          fetch-depth: 1

      - name: Print exact cross-tree ownership collisions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 tools/analysis/cross_tree_contract.py \
            --device-root . \
            --vendor-root vendor-tree \
            --json > "$RUNNER_TEMP/cross-tree-live.json"
          RC=$?
          set -e
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cross-tree-live.json').read_text())
          print(f"CROSS_TREE_COLLISION_COUNT={len(report['copy_destination_collisions'])}")
          for destination in report['copy_destination_collisions']:
              print(f"COLLISION {destination}")
              print(f"  DEVICE {report['device_copy_destinations'][destination]}")
              print(f"  VENDOR {report['vendor_copy_destinations'][destination]}")
          PY
          exit "$RC"
