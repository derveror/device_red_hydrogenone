name: Collect RED .118 radio init evidence

on:
  push:
    branches:
      - lineage-22.2-stock118-rework
    paths:
      - .github/workflows/collect-radio-evidence.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical RED .118 stock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r118/parts"
          ids=(
            1_B7suPmaiZsibKtmSg_IfIcgGaPz4nvt
            1AV1tt-lmg5z0MMn7aNKArS7bFfK8VHCp
            1wxs2du2Ml_--JrOwGlyDb49QMlrPxVMB
            1OMvS4diiiOCiX-yCKHH7HZKv77QaUCFn
            18czKWOxP9Xiw5g6ljCHI1Gt68Ynzxfi4
            19bMHqds6-PsYPtrs18okJ8XgdF85Z84L
            1xKaDVx16zH11ozeSeOjSlldi1-xrHcuj
            1XF4fPiTXBzVsVQU5I3VZGxw4Xm_T_DUe
          )
          sizes=(251658240 251658240 251658240 251658240 251658240 251658240 251658240 89063443)
          for i in "${!ids[@]}"; do
            out="$RUNNER_TEMP/r118/parts/part.$i"
            url="https://drive.usercontent.google.com/download?id=${ids[$i]}&export=download&confirm=t"
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$url" --output "$out"
            test "$(stat -c %s "$out")" = "${sizes[$i]}"
          done
          cat "$RUNNER_TEMP"/r118/parts/part.* > "$RUNNER_TEMP/r118/stock.rar"
          echo '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e  '"$RUNNER_TEMP/r118/stock.rar" | sha256sum -c -

      - name: Extract vendor init and property authority
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/7zip.tar.xz"
          mkdir -p "$RUNNER_TEMP/7zip" "$RUNNER_TEMP/r118/vendor-img" "$RUNNER_TEMP/r118/vendor-root" "$RUNNER_TEMP/r118/archive-props"
          tar -xJf "$RUNNER_TEMP/7zip.tar.xz" -C "$RUNNER_TEMP/7zip"
          chmod +x "$RUNNER_TEMP/7zip/7zz"
          seven="$RUNNER_TEMP/7zip/7zz"
          base='H1A1000.082ho.01.00.10r.118_userdebug_fastboot/fastboot'
          "$seven" e -y -o"$RUNNER_TEMP/r118/vendor-img" "$RUNNER_TEMP/r118/stock.rar" "$base/vendor.img"
          test "$(stat -c %s "$RUNNER_TEMP/r118/vendor-img/vendor.img")" = 593264872
          "$seven" x -y -o"$RUNNER_TEMP/r118/vendor-root" "$RUNNER_TEMP/r118/vendor-img/vendor.img"
          "$seven" e -y -o"$RUNNER_TEMP/r118/archive-props" "$RUNNER_TEMP/r118/stock.rar" "$base/build.prop"
          test -f "$RUNNER_TEMP/r118/vendor-root/etc/init/qcrild.rc"
          test -f "$RUNNER_TEMP/r118/vendor-root/etc/init/hw/init.qcom.rc"
          test -f "$RUNNER_TEMP/r118/archive-props/build.prop"

      - name: Generate machine-readable radio evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analyze_radio_evidence.py \
            --vendor-root "$RUNNER_TEMP/r118/vendor-root" \
            --extra-property-file "$RUNNER_TEMP/r118/archive-props/build.prop" \
            --stock-sha256 7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e \
            --output-json docs/stock/h1a1000-r118/radio-init-evidence.json \
            --output-md docs/stock/h1a1000-r118/RADIO_INIT_EVIDENCE.md
          python3 -m json.tool docs/stock/h1a1000-r118/radio-init-evidence.json >/dev/null
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_radio_evidence_parser -v
          git diff --check

      - name: Commit evidence and remove one-shot collector
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/collect-radio-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stock/h1a1000-r118/radio-init-evidence.json \
            docs/stock/h1a1000-r118/RADIO_INIT_EVIDENCE.md \
            .github/workflows/collect-radio-evidence.yml
          git diff --cached --check
          git commit -m 'docs: record RED .118 radio init evidence'
          git fetch origin lineage-22.2-stock118-rework
          git rebase origin/lineage-22.2-stock118-rework
          git push origin HEAD:lineage-22.2-stock118-rework
