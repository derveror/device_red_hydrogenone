name: Radio shell parser TDD

on:
  push:
    branches:
      - radio-shell-tdd

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run radio evidence parser tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/tests:$PWD" python3 -m unittest tests.test_radio_evidence_parser -v
